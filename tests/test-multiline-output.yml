name: Test multiline output capture
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          run: printf 'line1\nline2\nline3'
      - name: Assert stdout contains all lines
        env:
          ACTUAL: ${{ steps.action.outputs.stdout }}
        run: |
          echo "actual: '$ACTUAL'"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: stdout is empty"
            exit 1
          fi
          if ! echo "$ACTUAL" | grep -q "line1"; then
            echo "FAIL: expected 'line1' in output"
            exit 1
          fi
          if ! echo "$ACTUAL" | grep -q "line2"; then
            echo "FAIL: expected 'line2' in output"
            exit 1
          fi
          if ! echo "$ACTUAL" | grep -q "line3"; then
            echo "FAIL: expected 'line3' in output"
            exit 1
          fi
          echo "PASS"
