name: Test stderr capture
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          run: printf '%s' "error message" >&2
      - name: Assert stderr contains expected output
        env:
          ACTUAL: ${{ steps.action.outputs.stderr }}
        run: |
          echo "actual stderr: '$ACTUAL'"
          TRIMMED="$(echo "$ACTUAL" | tr -d '\n\r')"
          if [ "$TRIMMED" != "error message" ]; then
            echo "FAIL: expected 'error message' but got '$TRIMMED'"
            exit 1
          fi
          echo "PASS"
      - name: Assert stdout is empty
        env:
          ACTUAL: ${{ steps.action.outputs.stdout }}
        run: |
          echo "stdout: '$ACTUAL'"
          TRIMMED="$(echo "$ACTUAL" | tr -d '\n\r')"
          if [ -n "$TRIMMED" ]; then
            echo "FAIL: expected empty stdout but got '$TRIMMED'"
            exit 1
          fi
          echo "PASS"
